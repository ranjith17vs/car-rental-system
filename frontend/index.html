<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveEasy | Premium Car Rental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#020617',
                        card: 'rgba(30, 41, 59, 0.7)',
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 3s linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '100%': { backgroundPosition: '200% 50%' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(59, 130, 246, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(59, 130, 246, 0.6)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            overflow-x: hidden;
            background-color: #f8fafc;
        }

        /* Text color overrides for light mode */
        /* Make white text dark, UNLESS it is inside a primary coloured button */
        .text-white:not(.bg-blue-600):not(.bg-emerald-600):not(.bg-red-600) { color: #0f172a !important; }
        
        .text-zinc-400 { color: #475569 !important; }
        .bg-white\/5 { background-color: rgba(0, 0, 0, 0.03) !important; }
        .bg-white\/10 { background-color: rgba(0, 0, 0, 0.06) !important; }
        .border-white\/5 { border-color: rgba(0, 0, 0, 0.05) !important; }
        .border-white\/10 { border-color: rgba(0, 0, 0, 0.1) !important; }
        .border-white\/20 { border-color: rgba(0, 0, 0, 0.15) !important; }
        
        .bg-slate-900 { background-color: #f8fafc !important; color: #0f172a !important; }
        .bg-slate-950 { background-color: #f1f5f9 !important; color: #0f172a !important; }

        h1,
        h2,
        h3,
        h4,
        .font-premium {
            font-family: 'Outfit', sans-serif;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        .premium-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(240, 244, 248, 0.8)) !important;
            border: 1px solid rgba(0, 0, 0, 0.05) !important;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #3b82f6, #2563eb, #3b82f6, #60a5fa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-30px, 50px) scale(1.2); }
            66% { transform: translate(20px, -20px) scale(0.8); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: linear-gradient(rgba(248, 250, 252, 0.85), rgba(248, 250, 252, 0.95)), url('/car-rental-system/classic-aesthetic-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
</body>

</html>
